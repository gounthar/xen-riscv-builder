# Two-node K3s, agent half. Joins the server in domu-mn.cfg over xenbr0.
# No disk: the agent only needs its RAM root and the airgap images.
type = "pvh"
name = "domu2"
kernel = "/domu/Image.gz"
ramdisk = "/domu/initrd.img"
memory = 1344
vcpus = 1
extra = "console=hvc0 earlycon=sbi test=k3s net.addr=192.168.128.3/24 net.gw=192.168.128.1 k3s.role=agent k3s.server=https://192.168.128.2:6443 k3s.token=xen-riscv-payload-test k3s.nodename=domu2 k3s.cfgtimeout=3600 k3s.restarts=3 k3s.timeout=5400 k3s.podtimeout=2400 k3s.agenthold=180 progress=60"
vif = [ 'type=vif,mac=00:16:3e:00:00:02,bridge=xenbr0,script=/etc/xen/scripts/vif-bridge' ]
