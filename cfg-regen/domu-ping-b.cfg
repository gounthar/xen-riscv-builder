# domU-to-domU ping, sending half. 1000-byte payloads: above netback's
# header-copy length, so the receiving vif grant-copies from this domain's
# grant instead of from a dom0 page. That is the path that reached the
# page_get_owner_and_reference() stub in run 41.
type = "pvh"
name = "domu2"
kernel = "/domu/Image.gz"
ramdisk = "/domu/initrd.img"
memory = 1344
vcpus = 1
extra = "console=hvc0 earlycon=sbi test=disk net.addr=192.168.128.3/24 net.gw=192.168.128.1 net.ping=192.168.128.2 net.pingsize=1000 net.pingcount=5 progress=60"
vif = [ 'type=vif,mac=00:16:3e:00:00:02,bridge=xenbr0,script=/etc/xen/scripts/vif-bridge' ]
