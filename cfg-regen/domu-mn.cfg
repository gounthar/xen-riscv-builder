# Two-node K3s, server half. Started by xen-run2.sh MULTINODE=1 after
# domu2.cfg (the agent). Same kernel and payload as domu.cfg; the payload
# waits for two Ready nodes and pins its test pod to domu2, so the pod runs
# on the other domU and its logs come back across xenbr0.
type = "pvh"
name = "domu"
kernel = "/domu/Image.gz"
ramdisk = "/domu/initrd.img"
memory = 1344
vcpus = 1
extra = "console=hvc0 earlycon=sbi test=k3s net.addr=192.168.128.2/24 net.gw=192.168.128.1 k3s.token=xen-riscv-payload-test k3s.nodes=2 k3s.podnode=domu2 k3s.cfgtimeout=1800 k3s.restarts=3 k3s.timeout=5400 k3s.podtimeout=2400 progress=60"
vif = [ 'type=vif,mac=00:16:3e:00:00:01,bridge=xenbr0,script=/etc/xen/scripts/vif-bridge' ]
