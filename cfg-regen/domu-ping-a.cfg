# domU-to-domU ping, target half. No test runs (test=disk with no disk is
# reported as skipped); it just holds the domain up while domu2 pings it.
type = "pvh"
name = "domu"
kernel = "/domu/Image.gz"
ramdisk = "/domu/initrd.img"
memory = 1344
vcpus = 1
extra = "console=hvc0 earlycon=sbi test=disk net.addr=192.168.128.2/24 net.gw=192.168.128.1 net.hold=420 progress=60"
vif = [ 'type=vif,mac=00:16:3e:00:00:01,bridge=xenbr0,script=/etc/xen/scripts/vif-bridge' ]
