# riscv64 needs this explicitly: tools/xl/xl_parse.c defaults an
# unspecified type to PVH only for arm/aarch64, so riscv falls through
# to PV and libxl_riscv.c:602 asserts. See the xl_parse.c patch on
# gitlab.com/gounthar/xen branch riscv-builder-fixes.
type = "pvh"
name = "domu"
kernel = "/domu/Image.gz"
ramdisk = "/domu/initrd.img"
memory = 1344
vcpus = 1
extra = "console=hvc0 earlycon=sbi keep_bootcon test=all net.addr=192.168.128.2/24 net.gw=192.168.128.1 k3s.timeout=5400 k3s.podtimeout=2400 disk.timeout=900 progress=60"
vif = [ 'type=vif,mac=00:16:3e:00:00:01,bridge=xenbr0,script=/etc/xen/scripts/vif-bridge' ]
disk = [ 'format=raw,vdev=xvda,access=rw,backendtype=phy,target=/mnt/disk.img' ]
